# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  delete_expired_data:
    class: DeleteExpiredDataJob
    schedule: every day at 4am

  magic_link_cleanup:
    command: "MagicLink.cleanup"
    schedule: every day at 3am

  # Hosted only: the guard short-circuits before the engine constant is read,
  # so OSS installs never evaluate it. 10:00 UTC keeps the run clear of the
  # usual European-afternoon deploy window (a deploy can kill it mid-loop).
  setup_nudge:
    command: "Sessy.saas? && Sessy::Saas::SetupNudge.deliver_due"
    schedule: every day at 10am
